name: Chargement mensuel NYC Mobility

on:
  schedule:
    - cron: "17 7 5 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyc-mobility-etl
  cancel-in-progress: false

jobs:
  load-month:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install pandas pyarrow requests "psycopg[binary]"

      - name: Exécuter le pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/main.py
